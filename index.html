<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Ink Studio — MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1214;--panel:#261a1c;--line:#43302f;--bone:#efe4d0;--mute:#b7a892;--red:#c0392b;--gold:#e0a63a;--teal:#2f6b66;
--display:'Alfa Slab One',Georgia,serif;--body:'Work Sans',system-ui,sans-serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--ink);color:var(--bone);font:400 16px/1.6 var(--body)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);border-bottom:2px solid var(--red)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.logo{font:400 20px var(--display);letter-spacing:.02em}
nav{display:flex;gap:4px;overflow-x:auto}
nav a{padding:8px 12px;border-radius:4px;font-weight:500;white-space:nowrap}
nav a[aria-current=page]{background:var(--red)}
nav a:hover{background:var(--panel)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(44px,9vw,96px)}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:24px}
section{padding:56px 0}
.btn{display:inline-block;padding:12px 22px;border:2px solid var(--bone);background:transparent;color:var(--bone);font:600 15px var(--body);cursor:pointer;border-radius:4px}
.btn.solid{background:var(--red);border-color:var(--red)}
.btn:hover{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;padding:48px 0}
.hero p{max-width:46ch;color:var(--mute);font-size:18px}
.hero .art{aspect-ratio:4/5;border:3px solid var(--bone);box-shadow:10px 10px 0 var(--red)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:block}
.card .art{aspect-ratio:1}
.card .meta{padding:12px 14px;font-size:14px;color:var(--mute)}
.card .meta b{display:block;color:var(--bone);font-size:16px}
.art svg{display:block;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip,select,input,textarea{background:var(--panel);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font:500 14px var(--body)}
.chip{cursor:pointer}.chip[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--teal)}
.tag.reservado{background:var(--gold);color:var(--ink)}.tag.indisponivel{background:var(--line);color:var(--mute)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.list{list-style:none;padding:0;margin:0}.list li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
label{display:block;font-weight:500;margin-bottom:14px}
label input,label select,label textarea{display:block;width:100%;margin-top:6px}
.note{background:var(--panel);border-left:4px solid var(--gold);padding:12px 16px;color:var(--mute);font-size:14px;margin:20px 0}
footer{border-top:2px solid var(--red);padding:32px 0;color:var(--mute);font-size:14px}
.empty{padding:40px;text-align:center;color:var(--mute);border:1px dashed var(--line)}
@media(max-width:760px){.hero,.split{grid-template-columns:1fr}.hero .art{order:-1;max-width:320px}}
@media(prefers-reduced-motion:no-preference){.btn,nav a{transition:background .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="#/">Black Ink</a><nav id="nav"></nav></div></header>
<main id="app" class="wrap"></main>
<footer><div class="wrap" id="foot"></div></footer>
<script>
/* ===== Dados demonstrativos (espelham src/data/) ===== */
const studio={name:'Black Ink Studio',desc:'Estúdio especializado em diferentes estilos de tatuagem, com foco em arte autoral, atendimento personalizado e um ambiente confortável para cada cliente.',addr:'Rua das Artes, 245 — Vila Madalena, São Paulo - SP',whatsapp:'(11) 99999-9999',instagram:'@blackinkstudio',hours:[['Segunda a sexta','10h às 20h'],['Sábado','10h às 18h'],['Domingo','Fechado']]};
const artist={name:'Lucas Andrade',bio:'Tatuador especializado em diferentes estilos, com foco em composição, acabamento e desenvolvimento de trabalhos personalizados.',spec:['old-school','blackwork','realismo','neo-traditional']};
const styles=[
['old-school','Old School','Contornos grossos, paleta clássica e símbolos tradicionais.','#c0392b','#efe4d0'],
['realismo','Realismo','Sombras suaves e detalhes que reproduzem a realidade.','#3b3536','#bfb5a5'],
['blackwork','Blackwork','Preenchimentos sólidos em preto e alto contraste.','#0d0a0b','#efe4d0'],
['cyber-tribal','Cyber Tribal','Formas afiadas e simétricas com estética futurista.','#1d2f3a','#5fd0c8'],
['fine-line','Fine Line','Traços finos e delicados, composição minimalista.','#efe4d0','#1b1214'],
['neo-traditional','Neo Traditional','Base tradicional com cores ricas e mais ilustração.','#2f6b66','#e0a63a'],
['geometrico','Geométrico','Padrões, simetria e formas precisas.','#3a2a4a','#e0a63a'],
['colorido','Colorido','Paletas vibrantes e trabalhos cheios de cor.','#e0a63a','#c0392b']].map(([id,name,desc,bg,fg])=>({id,name,desc,bg,fg}));
const S=Object.fromEntries(styles.map(s=>[s.id,s]));
const body={braco:'Braço',antebraco:'Antebraço',ombro:'Ombro',peito:'Peito',costas:'Costas',costela:'Costela',perna:'Perna',panturrilha:'Panturrilha',mao:'Mão',pescoco:'Pescoço'};
const sizes={pequeno:'Pequeno',medio:'Médio',grande:'Grande'};
const W=[[1,'old-school','Animais','braco','medio',1],[2,'realismo','Retratos','antebraco','grande',1],[3,'blackwork','Símbolos','costas','grande',1],[4,'cyber-tribal','Abstrato','ombro','medio',1],[5,'fine-line','Floral','costela','pequeno'],[6,'neo-traditional','Floral','perna','grande'],[7,'geometrico','Mandalas','peito','medio'],[8,'colorido','Animais','panturrilha','medio'],[9,'old-school','Objetos','mao','pequeno'],[10,'blackwork','Animais','antebraco','medio'],[11,'realismo','Natureza','braco','grande'],[12,'neo-traditional','Animais','pescoco','pequeno']]
.map(([n,style,cat,part,size,f])=>({id:'work-'+n,n,style,cat,part,size,featured:!!f}));
const stLabel={disponivel:'Disponível',reservado:'Reservado',indisponivel:'Indisponível'};
const F=[[1,'old-school','Animais','disponivel'],[2,'blackwork','Símbolos','disponivel'],[3,'neo-traditional','Floral','reservado'],[4,'cyber-tribal','Abstrato','indisponivel'],[5,'old-school','Objetos','disponivel'],[6,'fine-line','Floral','disponivel'],[7,'colorido','Animais','reservado'],[8,'geometrico','Lettering','disponivel']]
.map(([n,style,cat,status])=>({id:'flash-'+n,n,code:'Flash 00'+n,style,cat,status}));

/* ===== Arte demonstrativa gerada (SVG) ===== */
const glyph={
'old-school':'<path d="M100 165C40 120 40 65 78 60c14-2 22 6 22 16 0-10 8-18 22-16 38 5 38 60-22 105z" fill="F" stroke="B" stroke-width="7"/>',
'realismo':'<circle cx="100" cy="100" r="60" fill="none" stroke="F" stroke-width="3"/><circle cx="100" cy="100" r="40" fill="none" stroke="F" stroke-width="3" opacity=".6"/><circle cx="100" cy="100" r="18" fill="F" opacity=".8"/>',
'blackwork':'<path d="M100 30l70 130H30z" fill="F"/><path d="M100 80l30 55H70z" fill="B"/>',
'cyber-tribal':'<path d="M30 100l35-50 35 50 35-50 35 50-35 50-35-50-35 50z" fill="none" stroke="F" stroke-width="10"/>',
'fine-line':'<path d="M100 170C100 110 60 90 40 50M100 170c0-50 40-70 60-110M100 130c-25-5-35-20-40-35M100 130c25-5 35-20 40-35" fill="none" stroke="F" stroke-width="2.5"/>',
'neo-traditional':'<g fill="none" stroke="F" stroke-width="6"><circle cx="100" cy="100" r="14"/><circle cx="100" cy="100" r="32"/><circle cx="100" cy="100" r="52"/></g><path d="M100 160v30" stroke="F" stroke-width="6"/>',
'geometrico':'<path d="M100 30l58 33v74l-58 33-58-33V63z" fill="none" stroke="F" stroke-width="4"/><path d="M100 30v140M42 63l116 74M158 63L42 137" stroke="F" stroke-width="2"/>',
'colorido':'<circle cx="80" cy="90" r="40" fill="F" opacity=".9"/><circle cx="125" cy="110" r="45" fill="B" opacity=".85"/><circle cx="100" cy="70" r="24" fill="#2f6b66"/>'};
function art(style,seed=0){const s=S[style],rot=(seed*37)%50-25;
return `<svg viewBox="0 0 200 200" role="img" aria-label="Arte demonstrativa ${s.name}"><rect width="200" height="200" fill="${s.bg}"/><g transform="rotate(${rot} 100 100)">${glyph[style].replaceAll('"F"','"'+s.fg+'"').replaceAll('"B"','"'+s.bg+'"')}</g></svg>`}

/* ===== Views ===== */
const $=id=>document.getElementById(id);
const wcard=w=>`<a class="card" href="#/trabalho/${w.id}"><div class="art">${art(w.style,w.n)}</div><div class="meta"><b>${S[w.style].name}</b>${w.cat} · ${body[w.part]} · ${sizes[w.size]}</div></a>`;
const fcard=f=>`<div class="card"><div class="art">${art(f.style,f.n+3)}</div><div class="meta"><b>${S[f.style].name}</b>${f.cat} <span class="tag ${f.status}">${stLabel[f.status]}</span><br>${f.status==='disponivel'?`<a href="#/agendar/${f.id}" style="color:var(--gold);font-weight:600">Quero este flash</a>`:''}</div></div>`;

const views={
home:()=>`<div class="hero"><div><h1>Arte na pele, feita com calma.</h1><p>${studio.desc}</p><p><a class="btn solid" href="#/agendar">Agendar tatuagem</a> <a class="btn" href="#/portfolio">Ver trabalhos</a></p></div><div class="art">${art('old-school',1)}</div></div>
<section><h2>Trabalhos em destaque</h2><div class="grid">${W.filter(w=>w.featured).map(wcard).join('')}</div></section>
<section><h2>Estilos</h2><div class="grid">${styles.map(s=>`<a class="card" href="#/portfolio/${s.id}"><div class="art">${art(s.id,2)}</div><div class="meta"><b>${s.name}</b>${s.desc}</div></a>`).join('')}</div></section>
<section class="split"><div><h2>O estúdio</h2><p>${studio.desc}</p><a class="btn" href="#/estudio">Conhecer o estúdio</a></div><div class="card"><div class="art" style="aspect-ratio:16/9">${art('blackwork',5)}</div><div class="meta"><b>${artist.name}</b>${artist.bio}</div></div></section>
<section><h2>Flash tattoos</h2><div class="grid">${F.filter(f=>f.status==='disponivel').slice(0,4).map(fcard).join('')}</div><p><a class="btn" href="#/flash">Ver todos os flashes</a></p></section>`,

portfolio:(pre)=>{const q=views._q||(views._q={style:'',part:'',size:''});if(pre!==undefined)q.style=pre||q.style;
const list=W.filter(w=>(!q.style||w.style===q.style)&&(!q.part||w.part===q.part)&&(!q.size||w.size===q.size));
const sel=(k,opts,all)=>`<select data-f="${k}" aria-label="${all}"><option value="">${all}</option>${Object.entries(opts).map(([v,l])=>`<option value="${v}" ${q[k]===v?'selected':''}>${l}</option>`).join('')}</select>`;
return `<section><h2>Portfólio</h2><div class="chips">${sel('style',Object.fromEntries(styles.map(s=>[s.id,s.name])),'Todos os estilos')}${sel('part',body,'Qualquer parte do corpo')}${sel('size',sizes,'Qualquer tamanho')}</div>
${list.length?`<div class="grid">${list.map(wcard).join('')}</div>`:`<div class="empty">Nenhum trabalho com esses filtros. Remova um filtro para ver mais.</div>`}</section>`},

trabalho:(id)=>{const w=W.find(x=>x.id===id);if(!w)return views.portfolio();
const rel=W.filter(x=>x.id!==id).map(x=>({x,s:(x.style===w.style?2:0)+(x.part===w.part?1:0)})).sort((a,b)=>b.s-a.s).slice(0,4).map(o=>o.x);
return `<section class="split"><div class="card"><div class="art">${art(w.style,w.n)}</div></div><div><h2>${S[w.style].name}</h2><ul class="list"><li><span>Categoria</span><b>${w.cat}</b></li><li><span>Parte do corpo</span><b>${body[w.part]}</b></li><li><span>Tamanho</span><b>${sizes[w.size]}</b></li><li><span>Artista</span><b>${artist.name}</b></li></ul><p><a class="btn solid" href="#/agendar">Agendar algo parecido</a></p></div></section>
<section><h2>Trabalhos relacionados</h2><div class="grid">${rel.map(wcard).join('')}</div></section>`},

flash:()=>{const q=views._fs||'';const list=F.filter(f=>!q||f.status===q);
return `<section><h2>Flash tattoos</h2><p style="color:var(--mute);max-width:56ch">Desenhos prontos para tatuar. Escolha um disponível e envie o pedido de agendamento.</p><div class="chips">${['','disponivel','reservado','indisponivel'].map(s=>`<button class="chip" data-fs="${s}" aria-pressed="${q===s}">${s?stLabel[s]:'Todos'}</button>`).join('')}</div><div class="grid">${list.map(fcard).join('')}</div></section>`},

estudio:()=>`<section class="split"><div><h2>${studio.name}</h2><p>${studio.desc}</p><h3 style="font-size:22px;margin:28px 0 8px">${artist.name}</h3><p>${artist.bio}</p><p>${artist.spec.map(s=>`<span class="tag" style="margin-right:6px">${S[s].name}</span>`).join('')}</p></div>
<div><div class="card" style="margin-bottom:16px"><div class="art" style="aspect-ratio:16/9">${art('neo-traditional',4)}</div></div><ul class="list"><li><span>Endereço</span><b>${studio.addr}</b></li><li><span>WhatsApp</span><b>${studio.whatsapp}</b></li><li><span>Instagram</span><b>${studio.instagram}</b></li>${studio.hours.map(h=>`<li><span>${h[0]}</span><b>${h[1]}</b></li>`).join('')}</ul></div></section>`,

agendar:(fid)=>`<section style="max-width:560px"><h2>Agendar tatuagem</h2><div class="note">Versão de demonstração: o envio é simulado e nenhum dado é salvo.</div>
<form id="book"><label>Nome<input name="n" required autocomplete="name"></label><label>WhatsApp<input name="w" required inputmode="tel" placeholder="(11) 90000-0000"></label>
<label>Estilo<select name="s">${styles.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label>
<label>Flash (opcional)<select name="f"><option value="">Nenhum, ideia própria</option>${F.filter(f=>f.status==='disponivel').map(f=>`<option value="${f.id}" ${f.id===fid?'selected':''}>${S[f.style].name} · ${f.cat} (${f.code})</option>`).join('')}</select></label>
<label>Data preferida<input type="date" name="d" required></label><label>Conte sua ideia<textarea name="m" rows="4" placeholder="Local do corpo, tamanho, referências…"></textarea></label>
<button class="btn solid" type="submit">Enviar pedido</button></form></section>`
};

/* ===== Router ===== */
const links=[['#/','Início'],['#/portfolio','Portfólio'],['#/flash','Flash'],['#/estudio','Estúdio'],['#/agendar','Agendar']];
function route(){const [,r='',a]=location.hash.split('/');const k=views[r||'home']?(r||'home'):'home';
const main=r==='portfolio'&&a?views.portfolio(a):views[k](a);$('app').innerHTML=main;
$('nav').innerHTML=links.map(([h,l])=>`<a href="${h}" ${(h==='#/'&&k==='home')||h==='#/'+k||(k==='trabalho'&&h==='#/portfolio')?'aria-current="page"':''}>${l}</a>`).join('');
document.title=studio.name+' — MVP';scrollTo(0,0)}
addEventListener('hashchange',route);route();
$('foot').innerHTML=`<b>${studio.name}</b> · ${studio.addr} · ${studio.whatsapp} · ${studio.instagram}<br>Conteúdo e imagens demonstrativos. Dados fictícios.`;
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(f){views._q[f]=e.target.value;$('app').innerHTML=views.portfolio()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-fs]');if(b){views._fs=b.dataset.fs;$('app').innerHTML=views.flash()}});
document.addEventListener('submit',e=>{if(e.target.id!=='book')return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
$('app').innerHTML=`<section style="max-width:560px"><h2>Pedido enviado</h2><p>Obrigado, ${d.n.replace(/[<>&]/g,'')}. Você receberá uma resposta pelo WhatsApp para confirmar a data.</p><a class="btn" href="#/">Voltar ao início</a></section>`});
</script>
</body>
</html>
